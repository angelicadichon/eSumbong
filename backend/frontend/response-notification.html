<!DOCTYPE html>

<head>

  <!-- Icons & Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/response-notifications.css">

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>


  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="image/favicon.png" alt="Logo" class="sidebar-logo">
      <h2>eSumbong</h2>
    </div>

    <nav>
      <ul>
        <li class="nav-item">
          <a href="response-dashboard.html">
            <i data-lucide="layout-dashboard"></i> Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="response-profile.html">
            <i data-lucide="user"></i> Profile
          </a>
        </li>

      
       <li class="nav-item active">
           <a href="response-notifications.html" id="notifBell">
         <i data-lucide="bell"></i>
                   Notifications
       
       </a>
       </li>

        <li class="nav-item logout-btn"><a href="index.html" onclick="logout(); return false;"><i data-lucide="log-out"></i> Logout</a></li>
       
      </ul>
    </nav>
  </aside>

   <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-header">
      <h1>SK Notifications</h1>

      <div class="user-profile-header">

          <div class="initials" id="profileInitials">U</div>

      </div>

<section class="notif-section">

      <button id="deleteAllBtn" class="delete-all-btn">Delete All</button>
  </div>
  
  <div id="notifList" class="notif-grid"></div>
  
  <!-- PAGINATION CONTROLS -->
  <div id="paginationContainer" class="pagination-controls">
      <button id="paginationPrevBtn" class="pagination-btn" disabled>Previous</button>
      <span id="pageInfo" class="page-info">Page 1 of 1</span>
      <button id="paginationNextBtn" class="pagination-btn" disabled>Next</button>
  </div>
</section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
